name: Review Aptos signed intent
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/aptos-intent-review.yml', 'scripts/aptos-intent-review.py', 'fixtures/aptos-intent/**', 'tests/test_aptos_intent_review.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_aptos_intent_review.py
      - run: |
          git clone --no-checkout https://github.com/OathWallet/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach 32701474fefbed3840878e35f6111e8d494e1f02
          python3 scripts/aptos-intent-review.py .work/wallet .work/aptos-intent evidence/ci/aptos-intent
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: aptos-intent-review-evidence, path: evidence/ci/aptos-intent, retention-days: 90}
