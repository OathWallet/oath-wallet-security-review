name: Verify token search refresh ordering
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/token-search-order.yml', 'scripts/token-search-order.py', 'tests/test_token_search_order.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_token_search_order.py
      - run: git clone --no-checkout https://github.com/devdasx/oath-wallet.git .work/wallet
      - run: git -C .work/wallet checkout --detach b57d05196be319d1f0530e28f667eb89023a1c4a
      - run: python3 scripts/run.py .work/wallet token-lookup --expected-commit b57d05196be319d1f0530e28f667eb89023a1c4a --scratch .work/full-token-build --output evidence/ci
      - run: python3 scripts/token-search-order.py .work/wallet .work/order-build evidence/ci/order
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: token-search-order-evidence, path: evidence/ci, retention-days: 90}
