name: Reproduce XRP Connect simulation validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/xrpl-connect-simulation.yml', 'scripts/xrpl-connect-simulation.py', 'tests/test_xrpl_connect_simulation.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_xrpl_connect_simulation.py
      - run: |
          git clone --no-checkout https://github.com/devdasx/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach f8a6d29803594f1f3a74063e92f90b8155122556
      - run: |
          mkdir -p evidence/ci/xrpl-connect-simulation
          cp evidence/ci/toolchain.txt evidence/ci/xrpl-connect-simulation/
          python3 scripts/xrpl-connect-simulation.py .work/wallet .work/build evidence/ci/xrpl-connect-simulation/before --before
          git -C .work/wallet checkout --detach 8a31eb265c34ef7f37ba21741201842366d43b7b
          python3 scripts/xrpl-connect-simulation.py .work/wallet .work/build evidence/ci/xrpl-connect-simulation/after
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: xrpl-connect-simulation-evidence, path: evidence/ci/xrpl-connect-simulation, retention-days: 90}
