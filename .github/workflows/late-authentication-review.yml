name: Review delayed authentication replies
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/late-authentication-review.yml', 'scripts/late-authentication-review.py', 'fixtures/late-authentication/**', 'tests/test_late_authentication_review.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_late_authentication_review.py
      - run: |
          git clone --no-checkout https://github.com/OathWallet/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach a9c062a3a1d492799b9f6e9d083630c7006183ea
          python3 scripts/late-authentication-review.py .work/wallet .work/late-auth-production evidence/ci/late-authentication/production
          python3 scripts/late-authentication-review.py .work/wallet .work/late-auth-mutation evidence/ci/late-authentication/mutation --mutate-generation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: late-authentication-review-evidence, path: evidence/ci/late-authentication, retention-days: 90}
