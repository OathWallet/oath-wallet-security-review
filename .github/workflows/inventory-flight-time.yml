name: Reproduce TRON and TON delayed inventory repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inventory-flight-time.yml', 'scripts/inventory-flight-time.py', 'scripts/inventory-flight-adjacent.py', 'tests/test_inventory_flight_time.py', 'fixtures/inventory-flight-time/**']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_inventory_flight_time.py
      - run: |
          git clone --no-checkout https://github.com/devdasx/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach fd06fdff104d128e00cc414d2de1472f11752e04
          python3 scripts/inventory-flight-time.py .work/wallet .work/before evidence/ci/inventory-flight-time/before --baseline --expected-commit fd06fdff104d128e00cc414d2de1472f11752e04
          git -C .work/wallet checkout --detach 63e0be4a10106fc577792a7fb3c6d69b1cc8870c
          python3 scripts/inventory-flight-time.py .work/wallet .work/after evidence/ci/inventory-flight-time/after --expected-commit 63e0be4a10106fc577792a7fb3c6d69b1cc8870c
          python3 scripts/inventory-flight-adjacent.py .work/after/source .work/after/build evidence/ci/inventory-flight-time/adjacent --expected-commit 63e0be4a10106fc577792a7fb3c6d69b1cc8870c
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: inventory-flight-time-evidence, path: evidence/ci/inventory-flight-time, retention-days: 90}
