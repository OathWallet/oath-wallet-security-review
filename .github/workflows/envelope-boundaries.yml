name: Check envelope boundary hypotheses
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/envelope-boundaries.yml', 'scripts/envelope-boundaries.py', 'fixtures/envelope-boundaries/**']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: git clone --no-checkout https://github.com/devdasx/oath-wallet.git .work/wallet
      - run: python3 scripts/envelope-boundaries.py .work/wallet .work/envelope-build evidence/ci/envelope
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: envelope-boundary-evidence, path: evidence/ci/envelope, retention-days: 90}
