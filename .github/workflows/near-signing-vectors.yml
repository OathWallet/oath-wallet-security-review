name: Reproduce NEAR signing vectors and reader repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/near-signing-vectors.yml', 'scripts/near-signing-vectors.py', 'scripts/near_signing_evidence.py', 'scripts/near-reader-regressions.py', 'fixtures/near-signing/**', 'tests/test_near_signing_fixture.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '26.5.0'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_near_signing_fixture.py
      - run: |
          git clone --no-checkout https://github.com/devdasx/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach 0614556b993f85808b13e3a69984ce36050a8dfe
      - name: Preserve expected pre-repair failure
        id: before
        continue-on-error: true
        run: python3 scripts/near-signing-vectors.py .work/wallet .work/near-signing evidence/ci/near-signing/before
      - name: Require the exact expected crash and four passing controls
        env:
          BASELINE_OUTCOME: ${{ steps.before.outcome }}
        run: |
          test "$BASELINE_OUTCOME" = failure
          python3 scripts/near_signing_evidence.py evidence/ci/near-signing/before --baseline
      - run: |
          git -C .work/wallet checkout --detach 5d91d1e4dfd36c56031c7a8fb1ee305446dc54de
          python3 scripts/near-signing-vectors.py .work/wallet .work/near-signing evidence/ci/near-signing/after --commit 5d91d1e4dfd36c56031c7a8fb1ee305446dc54de
          python3 scripts/near_signing_evidence.py evidence/ci/near-signing/after
          python3 scripts/near-reader-regressions.py .work/wallet .work/near-signing/build evidence/ci/near-signing/regressions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: near-signing-vectors-evidence, path: evidence/ci/near-signing, retention-days: 90}
