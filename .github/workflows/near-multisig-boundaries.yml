name: Check NEAR multisig boundaries and artifact provenance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/near-multisig-boundaries.yml', 'scripts/near-multisig-boundaries.py', 'tests/test_near_multisig_evidence.py', 'scripts/near_contract_provenance.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_near_multisig_evidence.py
      - run: |
          git clone --no-checkout https://github.com/devdasx/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach 5d91d1e4dfd36c56031c7a8fb1ee305446dc54de
          git clone --no-checkout https://github.com/near/core-contracts.git .work/near-contract
          git -C .work/near-contract checkout --detach 1b0436c96379c63aee7d2429c6d5d24019031ab8
          python3 scripts/near_contract_provenance.py .work/wallet .work/near-contract evidence/ci/near-multisig-boundaries/provenance.json
          python3 scripts/near-multisig-boundaries.py .work/wallet .work/near-build evidence/ci/near-multisig-boundaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: near-multisig-boundaries-evidence, path: evidence/ci/near-multisig-boundaries, retention-days: 90}
