name: Reproduce Sui and XRP history restart boundaries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/history-restart-boundaries.yml', 'scripts/history-restart-boundaries.py', 'scripts/history-restart-adjacent.py', 'tests/test_history_restart_boundaries.py', 'fixtures/history-restart-boundaries/**']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_history_restart_boundaries.py
      - run: |
          git clone --no-checkout https://github.com/devdasx/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach 05e7917f0a3c26072b1a6b88d2e9e4a0d0310427
          python3 scripts/history-restart-boundaries.py .work/wallet .work/before evidence/ci/history-restart-boundaries/before --baseline --expected-commit 05e7917f0a3c26072b1a6b88d2e9e4a0d0310427
          git -C .work/wallet checkout --detach b3f1f6af98bedfe850d390cac684a563c598e3ac
          python3 scripts/history-restart-boundaries.py .work/wallet .work/after evidence/ci/history-restart-boundaries/after --expected-commit b3f1f6af98bedfe850d390cac684a563c598e3ac
          python3 scripts/history-restart-adjacent.py .work/after/source .work/after/build evidence/ci/history-restart-boundaries/adjacent --expected-commit b3f1f6af98bedfe850d390cac684a563c598e3ac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: history-restart-boundaries-evidence, path: evidence/ci/history-restart-boundaries, retention-days: 90}
