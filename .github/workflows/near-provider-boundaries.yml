name: Check NEAR provider and request boundaries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/near-provider-boundaries.yml', 'scripts/near-provider-boundaries.py', 'tests/test_near_provider_boundaries.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_near_provider_boundaries.py
      - run: |
          git clone --no-checkout https://github.com/devdasx/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach 0614556b993f85808b13e3a69984ce36050a8dfe
          python3 scripts/near-provider-boundaries.py .work/wallet .work/near-build evidence/ci/near-provider-boundaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: near-provider-boundaries-evidence, path: evidence/ci/near-provider-boundaries, retention-days: 90}
