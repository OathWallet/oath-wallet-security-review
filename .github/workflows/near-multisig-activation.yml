name: Check NEAR activation and bootstrap authority boundaries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/near-multisig-activation.yml', 'scripts/near-multisig-activation.py', 'tests/test_near_multisig_activation.py', 'fixtures/near-multisig-activation/**']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_near_multisig_activation.py
      - run: |
          git clone --no-checkout https://github.com/OathWallet/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach 5d91d1e4dfd36c56031c7a8fb1ee305446dc54de
          python3 scripts/near-multisig-activation.py .work/wallet .work/near-control evidence/ci/near-multisig-activation/control
          python3 scripts/near-multisig-activation.py .work/wallet .work/near-mutant evidence/ci/near-multisig-activation/mutant --mutant
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: near-multisig-activation-evidence, path: evidence/ci/near-multisig-activation, retention-days: 90}
