name: Reproduce pending Connect wallet removal guards
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-removal.yml', 'scripts/connect-removal.py', 'tests/test_connect_removal.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_connect_removal.py
      - run: |
          git clone --no-checkout https://github.com/OathWallet/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach 31178e42e40d67218c2b52eda0024a5b4224f376
      - run: |
          mkdir -p evidence/ci/connect-removal
          cp evidence/ci/toolchain.txt evidence/ci/connect-removal/
          python3 scripts/connect-removal.py .work/wallet .work/build evidence/ci/connect-removal/before --phase before
          git -C .work/wallet checkout --detach 610f2fbcfa1b9a08bf9cfd9b439247324bf5366a
          python3 scripts/connect-removal.py .work/wallet .work/build evidence/ci/connect-removal/compatibility --phase compatibility
          git -C .work/wallet checkout --detach 0e91ce56f91ef56b3e45629967e01e449be0052f
          python3 scripts/connect-removal.py .work/wallet .work/build evidence/ci/connect-removal/after --phase after
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: connect-removal-evidence, path: evidence/ci/connect-removal, retention-days: 90}
