name: Reproducible review evidence (not a completion verdict)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation_kind:
        description: Full suite, scanners, isolated packages, or boundary harnesses
        type: choice
        default: full
        options: [full, scanners, packages, boundaries]
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}-${{ inputs.validation_kind || 'full' }}
  # Keep earlier checkpoints queued while a full matrix is using the runners.
  queue: max
  cancel-in-progress: false
jobs:
  inventory:
    if: inputs.validation_kind != 'scanners'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: python3 scripts/checkout.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: |
          python3 scripts/inventory.py .work/source --output evidence/ci/inventory.json
          cmp scope/inventory.json evidence/ci/inventory.json
          python3 scripts/dependencies.py .work/source --output evidence/ci
      - name: Record outstanding coverage without converting it to a pass
        run: |
          set +e
          python3 scripts/completion.py > evidence/ci/completion.txt
          result=$?
          printf '%s\n' "$result" > evidence/ci/completion-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: inventory-evidence, path: evidence/ci, retention-days: 90}
  scanners:
    if: inputs.validation_kind != 'packages' && inputs.validation_kind != 'boundaries'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: python3 scripts/checkout.py
      - run: python3 scripts/tools.py
      - name: Raw secret scan and exact hash-bound reconciliation
        run: |
          mkdir -p evidence/ci
          set +e
          .work/tools/gitleaks dir .work/source --redact --report-format json --report-path evidence/ci/gitleaks.json > evidence/ci/gitleaks.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > evidence/ci/gitleaks-exit-code.txt
          test "$result" -le 1
          python3 scripts/reconcile-secrets.py .work/source evidence/ci/gitleaks.json evidence/ci/secret-reconciliation.json
      - name: Preserve unfiltered Go dependency advisories
        if: always()
        run: |
          set +e
          .work/tools/osv-scanner scan source --lockfile .work/source/Tools/AezeedBridge/go.mod --no-call-analysis=go --format json --output-file evidence/ci/osv-go.json > evidence/ci/osv-go.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > evidence/ci/osv-go-exit-code.txt
          test "$result" -le 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: scanner-evidence, path: evidence/ci, retention-days: 90}
  host:
    if: inputs.validation_kind != 'scanners' && inputs.validation_kind != 'boundaries'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        check: ${{ fromJSON(inputs.validation_kind == 'packages' && '["OathDiagnostics", "OathCloudBackup", "OathDatabase", "OathBitcoin", "OathAnkr", "OathAezeed", "OathWalletHandoff", "OathTokenImages", "OathExchangeRates"]' || '["OathDiagnostics", "OathCloudBackup", "OathDatabase", "OathBitcoin", "OathAnkr", "OathAezeed", "OathWalletHandoff", "OathTokenImages", "OathExchangeRates", "security", "envelope", "authentication", "protected-startup", "lifecycle", "walletconnect", "evm-send", "solana-send", "tron-send", "xrpl-send", "stellar-send", "aptos-send", "sui-send", "near-send", "ton-send", "thorchain-send", "arc-send", "permission-batch", "cloud-restore", "public", "diagnostics-coverage", "clipboard", "walletconnect-sdk", "walletconnect-verify", "scanner", "wallet-links", "scanner-lifecycle", "app-updates", "token-lookup"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 scripts/checkout.py
      - name: Install pinned source-boundary scanner
        if: matrix.check == 'public'
        run: |
          python3 scripts/tools.py
          echo "$PWD/.work/tools" >> "$GITHUB_PATH"
      - run: python3 scripts/run.py .work/source '${{ matrix.check }}' --output evidence/ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: host-${{ matrix.check }}
          path: evidence/ci
          retention-days: 90
  solana-vector-isolation:
    if: inputs.validation_kind != 'scanners'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 scripts/checkout.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '26.5.0'}
      - name: Reproduce independent SDK fixtures with a locked toolchain
        run: |
          mkdir -p evidence/ci
          npm ci --prefix fixtures/squads-sdk --ignore-scripts --no-fund > evidence/ci/sdk-clean-install.log 2>&1
          sandbox-exec -p '(version 1) (allow default) (deny network*)' node fixtures/squads-sdk/verify.cjs .work/source > evidence/ci/sdk-regeneration.log 2>&1
      - name: Preserve audit-tool dependency advisories
        if: always()
        run: |
          set +e
          npm audit --prefix fixtures/squads-sdk --json > evidence/ci/sdk-advisories.json
          result=$?
          set -e
          printf '%s\n' "$result" > evidence/ci/sdk-advisories-exit-code.txt
          test "$result" -le 1
      - run: |
          python3 scripts/solana-vector-isolation.py .work/source \
            --expected-commit "$(git -C .work/source rev-parse HEAD)" \
            --scratch .work/solana-vectors-build --output evidence/ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: solana-vector-isolation, path: evidence/ci, retention-days: 90}
