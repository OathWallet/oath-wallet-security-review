name: Reproducible review evidence (not a completion verdict)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation_kind:
        description: Full suite, scanners, isolated packages, or boundary harnesses
        type: choice
        default: full
        options: [full, scanners, packages, boundaries]
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}-${{ inputs.validation_kind || 'full' }}
  cancel-in-progress: false
jobs:
  inventory:
    if: inputs.validation_kind != 'scanners'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: python3 scripts/checkout.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: |
          python3 scripts/inventory.py .work/source --output evidence/ci/inventory.json
          cmp scope/inventory.json evidence/ci/inventory.json
          python3 scripts/dependencies.py .work/source --output evidence/ci
      - name: Record outstanding coverage without converting it to a pass
        run: |
          set +e
          python3 scripts/completion.py > evidence/ci/completion.txt
          result=$?
          printf '%s\n' "$result" > evidence/ci/completion-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: inventory-evidence, path: evidence/ci, retention-days: 90}
  scanners:
    if: inputs.validation_kind != 'packages' && inputs.validation_kind != 'boundaries'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: python3 scripts/checkout.py
      - run: python3 scripts/tools.py
      - name: Raw secret scan and exact hash-bound reconciliation
        run: |
          mkdir -p evidence/ci
          set +e
          .work/tools/gitleaks dir .work/source --redact --report-format json --report-path evidence/ci/gitleaks.json > evidence/ci/gitleaks.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > evidence/ci/gitleaks-exit-code.txt
          test "$result" -le 1
          python3 scripts/reconcile-secrets.py .work/source evidence/ci/gitleaks.json evidence/ci/secret-reconciliation.json
      - name: Preserve unfiltered Go dependency advisories
        if: always()
        run: |
          .work/tools/osv-scanner scan source --lockfile .work/source/Tools/AezeedBridge/go.mod --no-call-analysis=go --format json --output-file evidence/ci/osv-go.json > evidence/ci/osv-go.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: scanner-evidence, path: evidence/ci, retention-days: 90}
  host:
    if: inputs.validation_kind != 'scanners' && inputs.validation_kind != 'boundaries'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        check: ${{ fromJSON(inputs.validation_kind == 'packages' && '["OathDiagnostics", "OathCloudBackup", "OathDatabase", "OathBitcoin", "OathAnkr", "OathAezeed", "OathWalletHandoff"]' || '["OathDiagnostics", "OathCloudBackup", "OathDatabase", "OathBitcoin", "OathAnkr", "OathAezeed", "OathWalletHandoff", "security", "envelope", "authentication", "protected-startup", "lifecycle", "walletconnect", "evm-send", "solana-send", "tron-send", "xrpl-send", "stellar-send", "aptos-send", "sui-send", "near-send", "ton-send", "thorchain-send", "arc-send", "permission-batch", "cloud-restore", "public", "diagnostics-coverage", "clipboard", "walletconnect-sdk", "walletconnect-verify", "scanner", "wallet-links", "scanner-lifecycle"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 scripts/checkout.py
      - name: Install pinned source-boundary scanner
        if: matrix.check == 'public'
        run: |
          python3 scripts/tools.py
          echo "$PWD/.work/tools" >> "$GITHUB_PATH"
      - run: python3 scripts/run.py .work/source '${{ matrix.check }}' --output evidence/ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: host-${{ matrix.check }}
          path: evidence/ci
          retention-days: 90
  ton-properties:
    if: inputs.validation_kind != 'scanners' && inputs.validation_kind != 'packages'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 scripts/checkout.py
      - run: python3 scripts/ton-properties.py .work/source --output evidence/ci --scratch .work/ton-properties
      - run: python3 scripts/ton-authorization.py .work/source --output evidence/ci --scratch .work/ton-authorization
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: ton-properties-evidence, path: evidence/ci, retention-days: 90}
  solana-properties:
    if: inputs.validation_kind != 'scanners' && inputs.validation_kind != 'packages'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 scripts/checkout.py
      - run: python3 scripts/solana-properties.py .work/source --output evidence/ci --scratch .work/solana-properties
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: solana-properties-evidence, path: evidence/ci, retention-days: 90}
  parser:
    if: inputs.validation_kind != 'scanners' && inputs.validation_kind != 'packages'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 scripts/checkout.py
      - name: Reproduce baseline failure and fixed success
        run: |
          git clone --no-checkout https://github.com/devdasx/oath-wallet.git .work/baseline
          git -C .work/baseline checkout --detach c7cdbde5e9f136b595500e92fbc904b107dcd8ee
          set +e
          sh scripts/parser-check.sh .work/baseline .work/parser-before > evidence/ci/parser-before.log 2>&1
          before=$?
          set -e
          test "$before" -eq 1
          grep -q '6016 checks, 1 failures' evidence/ci/parser-before.log
          sh scripts/parser-check.sh .work/source .work/parser-after > evidence/ci/parser-after.log 2>&1
          grep -q '6016 checks, 0 failures' evidence/ci/parser-after.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: parser-evidence, path: evidence/ci, retention-days: 90}
  relay-envelope:
    if: inputs.validation_kind != 'scanners' && inputs.validation_kind != 'packages'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 scripts/checkout.py
      - name: Reproduce plaintext relay rejection before and after the repair
        run: python3 scripts/relay-envelope-check.py .work/source --output evidence/ci/relay-envelope
      - name: Reproduce response-topic correlation before and after the repair
        run: python3 scripts/response-topic-check.py .work/source --output evidence/ci/response-topic
      - name: Trace pairing inputs through the application parser
        run: python3 scripts/pairing-link-check.py .work/source --output evidence/ci/uri-boundary
      - name: Reproduce pairing URI field boundaries before and after repair
        run: python3 scripts/uri-boundary-check.py .work/source --output evidence/ci/uri-boundary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: relay-envelope-evidence, path: evidence/ci, retention-days: 90}
  aezeed-source:
    if: inputs.validation_kind != 'scanners' && inputs.validation_kind != 'packages' && inputs.validation_kind != 'boundaries'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: {go-version: '1.26.5', cache: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 scripts/checkout.py
      - name: Test the bridge source with the race detector
        working-directory: .work/source/Tools/AezeedBridge
        run: |
          go version
          go mod verify
          go test -race -count=1 ./... > ../../../../evidence/ci/aezeed-go-tests.log 2>&1
          go vet ./... > ../../../../evidence/ci/aezeed-go-vet.log 2>&1
          go run ./cmd/seedvectors > ../../../../evidence/ci/aezeed-vectors.json
      - name: Check public fixture equality
        run: python3 -c "import json; assert json.load(open('evidence/ci/aezeed-vectors.json')) == json.load(open('.work/source/Packages/OathAezeed/Tests/OathAezeedTests/Fixtures/lnd-production.json'))"
      - name: Inventory all aezeed source targets and exercise independent vectors
        run: |
          reviewed=$(python3 -c "import json; print(json.load(open('scope/source.json'))['reviewed_commit'])")
          python3 scripts/go-source-inventory.py .work/source "$reviewed" evidence/ci/aezeed-selected-sources.json
          cd .work/source/Tools/AezeedBridge
          GOWORK=off GOFLAGS=-mod=readonly go run ../../../../tests/GoDependencyVectors.go > ../../../../evidence/ci/go-dependency-vectors.json
          GOWORK=off GOFLAGS=-mod=readonly go test -race -count=1 github.com/Yawning/aez github.com/kkdai/bstream golang.org/x/crypto/scrypt golang.org/x/crypto/pbkdf2 golang.org/x/crypto/blake2b > ../../../../evidence/ci/upstream-go-tests.log
      - name: Verify recorded aezeed artifacts and independent AES primitives
        run: |
          reviewed=$(python3 -c "import json; print(json.load(open('scope/source.json'))['reviewed_commit'])")
          python3 scripts/aezeed-provenance.py .work/source --expected-commit "$reviewed" --output evidence/ci/aezeed-provenance
          python3 scripts/aezeed-primitives.py .work/source --expected-commit "$reviewed" --output evidence/ci/aezeed-primitives
      - name: Preserve and classify current module advisories against selected source
        run: |
          python3 scripts/tools.py
          set +e
          .work/tools/osv-scanner scan source --lockfile .work/source/Tools/AezeedBridge/go.mod --no-call-analysis=go --format json --output-file evidence/ci/aezeed-osv.json > evidence/ci/aezeed-osv.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > evidence/ci/aezeed-osv-exit-code.txt
          test "$result" -le 1
          python3 scripts/go_advisory_triage.py evidence/ci/aezeed-osv.json evidence/ci/aezeed-selected-sources.json evidence/ci/aezeed-advisory-triage.json
      - name: Check reachable Go advisories
        working-directory: .work/source/Tools/AezeedBridge
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -json ./... > ../../../../evidence/ci/govulncheck.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: aezeed-source-evidence, path: evidence/ci, retention-days: 90}
  release-build:
    if: inputs.validation_kind != 'scanners' && inputs.validation_kind != 'packages' && inputs.validation_kind != 'boundaries'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 scripts/checkout.py
      - run: python3 scripts/run.py .work/source build --output evidence/ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: unsigned-ios-release-build, path: evidence/ci, retention-days: 90}
  upstream-entropy:
    if: inputs.validation_kind != 'scanners' && inputs.validation_kind != 'boundaries'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94
        with: {ruby-version: '4.0.5', bundler-cache: false}
      - run: sh scripts/toolchain.sh
      - run: python3 scripts/checkout.py
      - name: Test pinned upstream entropy failure handling
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/trustwallet/wallet-core.git .work/wallet-core
          git -C .work/wallet-core checkout --detach d40d24a63d92619167903369308bf0e2f7eb3a59
          sh scripts/upstream-entropy.sh .work/wallet-core .work/entropy > evidence/ci/entropy.log 2>&1
      - name: Test production mnemonic and derivation parsers with sanitizers
        run: |
          reviewed=$(python3 -c "import json; print(json.load(open('scope/source.json'))['reviewed_commit'])")
          python3 scripts/walletcore-mnemonic.py .work/wallet-core --app-source .work/source --app-commit "$reviewed" --output evidence/ci/upstream-mnemonic
      - name: Test actual upstream child derivation and retain unused API failures
        run: |
          reviewed=$(python3 -c "import json; print(json.load(open('scope/source.json'))['reviewed_commit'])")
          python3 scripts/walletcore-bip32.py .work/wallet-core --app-source .work/source --app-commit "$reviewed" --output evidence/ci/upstream-bip32
      - name: Characterize actual upstream constructor and entropy lifetime boundaries
        run: |
          reviewed=$(python3 -c "import json; print(json.load(open('scope/source.json'))['reviewed_commit'])")
          python3 scripts/walletcore-constructors.py .work/wallet-core --app-source .work/source --app-commit "$reviewed" --output evidence/ci/upstream-constructors
      - name: Test multisig recovery serialization mutations
        run: |
          reviewed=$(python3 -c "import json; print(json.load(open('scope/source.json'))['reviewed_commit'])")
          python3 scripts/multisig-recovery.py .work/source --commit "$reviewed" --output evidence/ci/multisig-recovery
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: upstream-entropy-evidence, path: evidence/ci, retention-days: 90}
