      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: relay-envelope-evidence, path: evidence/ci, retention-days: 90}
  aezeed-source:
    if: inputs.validation_kind != 'packages' && inputs.validation_kind != 'boundaries'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: {go-version: '1.26.5', cache: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 scripts/checkout.py
      - name: Select the same dependency sources used by the archive build
        run: |
          mkdir -p evidence/ci
          if test -f .work/source/Tools/AezeedBridge/prepare_source.py; then
            python3 .work/source/Tools/AezeedBridge/prepare_source.py .work/aezeed-build-source > evidence/ci/aezeed-prepare.log 2>&1
            cp .work/aezeed-build-source/prepared-source.json evidence/ci/aezeed-prepared-source.json
            echo "AEZEED_SOURCE_DIRECTORY=$PWD/.work/aezeed-build-source/Tools/AezeedBridge" >> "$GITHUB_ENV"
            echo "AEZEED_MODULE_MODE=vendor" >> "$GITHUB_ENV"
          else
            echo "AEZEED_SOURCE_DIRECTORY=$PWD/.work/source/Tools/AezeedBridge" >> "$GITHUB_ENV"
            echo "AEZEED_MODULE_MODE=readonly" >> "$GITHUB_ENV"
          fi
      - name: Test the bridge source with the race detector
        working-directory: ${{ env.AEZEED_SOURCE_DIRECTORY }}
        run: |
          go version
          go test -mod="$AEZEED_MODULE_MODE" -race -count=1 ./... > ../../../../evidence/ci/aezeed-go-tests.log 2>&1
          go vet -mod="$AEZEED_MODULE_MODE" ./... > ../../../../evidence/ci/aezeed-go-vet.log 2>&1
          go run -mod="$AEZEED_MODULE_MODE" ./cmd/seedvectors > ../../../../evidence/ci/aezeed-vectors.json
      - name: Check public fixture equality
        run: python3 -c "import json; assert json.load(open('evidence/ci/aezeed-vectors.json')) == json.load(open('.work/source/Packages/OathAezeed/Tests/OathAezeedTests/Fixtures/lnd-production.json'))"
      - name: Inventory all aezeed source targets and exercise independent vectors
        run: |
          reviewed=$(python3 -c "import json; print(json.load(open('scope/source.json'))['reviewed_commit'])")
          python3 scripts/go-source-inventory.py .work/source "$reviewed" evidence/ci/aezeed-selected-sources.json
          cd "$AEZEED_SOURCE_DIRECTORY"
          GOWORK=off go run -mod="$AEZEED_MODULE_MODE" ../../../../tests/GoDependencyVectors.go > ../../../../evidence/ci/go-dependency-vectors.json
          cd "$GITHUB_WORKSPACE/.work/source/Tools/AezeedBridge"
          # These upstream test files come from the immutable original modules.
          # Patched-source validation is the separate production regression job.
          GOWORK=off GOFLAGS=-mod=readonly go test -race -count=1 github.com/Yawning/aez github.com/kkdai/bstream golang.org/x/crypto/scrypt golang.org/x/crypto/pbkdf2 golang.org/x/crypto/blake2b > ../../../../evidence/ci/upstream-go-tests.log
      - name: Verify recorded aezeed artifacts and independent AES primitives
        run: |
          reviewed=$(python3 -c "import json; print(json.load(open('scope/source.json'))['reviewed_commit'])")
          python3 scripts/aezeed-provenance.py .work/source --expected-commit "$reviewed" --output evidence/ci/aezeed-provenance
          python3 scripts/aezeed-primitives.py .work/source --expected-commit "$reviewed" --output evidence/ci/aezeed-primitives
          if test -f .work/source/Tools/AezeedBridge/prepare_source.py; then
            python3 scripts/aezeed-repairs.py .work/source --expected-commit "$reviewed" --output evidence/ci/aezeed-repairs
          fi
      - name: Preserve and classify current module advisories against selected source
        run: |
          python3 scripts/tools.py
          set +e
          .work/tools/osv-scanner scan source --lockfile .work/source/Tools/AezeedBridge/go.mod --no-call-analysis=go --format json --output-file evidence/ci/aezeed-osv.json > evidence/ci/aezeed-osv.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > evidence/ci/aezeed-osv-exit-code.txt
          test "$result" -le 1
          python3 scripts/go_advisory_triage.py evidence/ci/aezeed-osv.json evidence/ci/aezeed-selected-sources.json evidence/ci/aezeed-advisory-triage.json
      - name: Check reachable Go advisories
        working-directory: ${{ env.AEZEED_SOURCE_DIRECTORY }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOFLAGS="-mod=$AEZEED_MODULE_MODE" govulncheck -json ./... > ../../../../evidence/ci/govulncheck.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: aezeed-source-evidence, path: evidence/ci, retention-days: 90}
  advisory-gate:
    if: inputs.validation_kind != 'packages' && inputs.validation_kind != 'boundaries'
    needs: [scanners, aezeed-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: python3 scripts/checkout.py
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with: {name: scanner-evidence, path: evidence/ci/raw-scanners}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with: {name: aezeed-source-evidence, path: evidence/ci/aezeed-source}
      - name: Gate raw scan against this run's exact selected-source inventory
        run: |
          reviewed=$(python3 -c "import json; print(json.load(open('scope/source.json'))['reviewed_commit'])")
          python3 scripts/advisory_gate.py .work/source evidence/ci/raw-scanners/osv-go.json evidence/ci/aezeed-source/aezeed-selected-sources.json evidence/ci/raw-scanners/osv-go-exit-code.txt evidence/ci/advisory-gate.json --commit "$reviewed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: advisory-gate-evidence, path: evidence/ci/advisory-gate.json, retention-days: 90}
  release-build:
    if: inputs.validation_kind != 'scanners' && inputs.validation_kind != 'packages' && inputs.validation_kind != 'boundaries'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 scripts/checkout.py
      - run: python3 scripts/run.py .work/source build --output evidence/ci --scratch .work/release-build
      - name: Trace this build's Swift and C compiler inputs
        run: python3 scripts/release-inputs.py .work/source --build-result evidence/ci/build.json --derived-data .work/release-build --output evidence/ci/build-inputs
      - name: Compare embedded Wallet Core images with the resolved arm64 slices
        run: python3 scripts/release-frameworks.py .work/source .work/release-build evidence/ci/build.json evidence/ci/build-inputs
      - name: Trace static BDK members surviving the framework link
        run: python3 scripts/bdk-linked-members.py .work/release-build evidence/ci/build-inputs/release-inputs.json evidence/ci/build-inputs/release-frameworks.json evidence/ci/build-inputs
      - name: Index network entry point candidates in compiled sources
        run: python3 scripts/transport-inputs.py .work/source .work/release-build evidence/ci/build-inputs/release-inputs.json evidence/ci/build-inputs/transport-inputs.json
      - name: Verify the resolved package ledger and the BDK distribution
        run: |
          packages=.work/release-build/SourcePackages
          python3 scripts/resolved-package-inventory.py .work/source "$packages/checkouts" --output evidence/ci/resolved-packages.json
          cmp scope/upstream-xcode-packages.json evidence/ci/resolved-packages.json
          git init -q .work/bdk-ffi
          git -C .work/bdk-ffi fetch --depth=1 https://github.com/bitcoindevkit/bdk-ffi.git 1c5f4863c6a53cc9d063d34c4e13c91fea5c58de
          git -C .work/bdk-ffi checkout -q --detach FETCH_HEAD
          python3 scripts/bdk-bridge-ledger.py .work/bdk-ffi --output evidence/ci/bdk-ffi.json
          cmp scope/upstream-bdk-ffi.json evidence/ci/bdk-ffi.json
          curl --fail --silent --show-error --location --retry 3 https://github.com/bitcoindevkit/bdk-swift/releases/download/3.1.1/bdkFFI.xcframework.zip -o .work/bdk.zip
          python3 scripts/bdk-distribution.py .work/bdk.zip "$packages/artifacts/bdk-swift/bdkFFI/bdkFFI.xcframework" evidence/ci/bdk-distribution.json
      - name: Verify the build-path instruction against preserved hosted evidence
        run: python3 scripts/bdk-cargo-path.py .work/release-build/SourcePackages/artifacts/bdk-swift/bdkFFI/bdkFFI.xcframework/ios-arm64/libbdkffi.a evidence/typed-keys/oath50-release-evidence/provenance/sdk18-5/comparison.json evidence/ci/bdk-path-instruction.json
      - name: Record independent BDK iOS archive reconstruction
        run: |
          sh scripts/rebuild-bdk-ios.sh .work/bdk-ffi .work/bdk-ios-rebuild .work/release-build/SourcePackages/artifacts/bdk-swift/bdkFFI/bdkFFI.xcframework/ios-arm64/libbdkffi.a
          cp .work/bdk-ios-rebuild/comparison.json evidence/ci/bdk-ios-reconstruction.json
          cp .work/bdk-ios-rebuild/packages.json evidence/ci/bdk-ios-packages.json
          python3 scripts/bdk-linked-exports.py ".work/release-build/Build/Products/Release-iphoneos/Oath Wallet.app" evidence/ci/build-inputs/release-frameworks.json evidence/ci/bdk-ios-reconstruction.json evidence/ci/build-inputs
          python3 scripts/bdk-selected-inputs.py .work/bdk-ios-rebuild/artifacts.jsonl .work/bdk-ios-rebuild/packages.json .work/bdk-ios-rebuild/bdk-ffi .work/bdk-ios-rebuild/cargo evidence/ci/bdk-extra-sources.json evidence/ci/bdk-rustc-inputs.json
          cmp scope/upstream-bdk-rust-selected.json evidence/ci/bdk-extra-sources.json
          python3 scripts/bdk-native-curve.py .work/bdk-ios-rebuild .work/bdk-curve-build evidence/ci/bdk-native-curve.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: unsigned-ios-release-build, path: evidence/ci, retention-days: 90}
  upstream-entropy:
    if: inputs.validation_kind != 'scanners' && inputs.validation_kind != 'boundaries'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94
        with: {ruby-version: '4.0.5', bundler-cache: false}
      - run: sh scripts/toolchain.sh
      - run: python3 scripts/checkout.py
      - name: Test pinned upstream entropy failure handling
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/trustwallet/wallet-core.git .work/wallet-core
          git -C .work/wallet-core checkout --detach d40d24a63d92619167903369308bf0e2f7eb3a59
          sh scripts/upstream-entropy.sh .work/wallet-core .work/entropy > evidence/ci/entropy.log 2>&1
      - name: Exercise the upstream path C API with sanitizers
        run: sh scripts/core-path-boundary.sh .work/wallet-core > evidence/ci/core-path.log 2>&1
      - name: Test production mnemonic and derivation parsers with sanitizers
        run: |
          reviewed=$(python3 -c "import json; print(json.load(open('scope/source.json'))['reviewed_commit'])")
          python3 scripts/walletcore-mnemonic.py .work/wallet-core --app-source .work/source --app-commit "$reviewed" --output evidence/ci/upstream-mnemonic
      - name: Test actual upstream child derivation and retain unused API failures
        run: |
          reviewed=$(python3 -c "import json; print(json.load(open('scope/source.json'))['reviewed_commit'])")
          python3 scripts/walletcore-bip32.py .work/wallet-core --app-source .work/source --app-commit "$reviewed" --output evidence/ci/upstream-bip32
      - name: Characterize actual upstream constructor and entropy lifetime boundaries
        run: |
          reviewed=$(python3 -c "import json; print(json.load(open('scope/source.json'))['reviewed_commit'])")
          python3 scripts/walletcore-constructors.py .work/wallet-core --app-source .work/source --app-commit "$reviewed" --output evidence/ci/upstream-constructors
      - name: Test multisig recovery serialization mutations
        run: |
          reviewed=$(python3 -c "import json; print(json.load(open('scope/source.json'))['reviewed_commit'])")
          python3 scripts/multisig-recovery.py .work/source --commit "$reviewed" --output evidence/ci/multisig-recovery
      - name: Retest published dependency source repairs in disposable checkouts
        run: |
          reviewed=$(python3 -c "import json; print(json.load(open('scope/source.json'))['reviewed_commit'])")
          python3 scripts/walletcore-bip32.py .work/wallet-core --app-source .work/source --app-commit "$reviewed" --repair --output evidence/ci/upstream-bip32-repaired
          python3 scripts/walletcore-constructors.py .work/wallet-core --app-source .work/source --app-commit "$reviewed" --repair --output evidence/ci/upstream-constructors-repaired
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: upstream-entropy-evidence, path: evidence/ci, retention-days: 90}
