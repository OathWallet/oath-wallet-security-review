name: Reproduce cloud restore lifecycle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloud-restore-lifecycle.yml', 'scripts/cloud-restore-lifecycle.py', 'fixtures/cloud-restore-lifecycle/**', 'tests/test_cloud_restore_lifecycle.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_cloud_restore_lifecycle.py
      - run: |
          git clone --no-checkout https://github.com/OathWallet/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach a904515793b087289140e4411924f030b3fe61ff
      - run: |
          mkdir -p evidence/ci/cloud-restore-lifecycle
          cp evidence/ci/toolchain.txt evidence/ci/cloud-restore-lifecycle/
          python3 scripts/cloud-restore-lifecycle.py .work/wallet evidence/ci/cloud-restore-lifecycle/production
          python3 scripts/cloud-restore-lifecycle.py .work/wallet evidence/ci/cloud-restore-lifecycle/mutation --mutate-catch-guard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: cloud-restore-lifecycle-evidence, path: evidence/ci/cloud-restore-lifecycle, retention-days: 90}
