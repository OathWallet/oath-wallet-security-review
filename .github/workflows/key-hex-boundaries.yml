name: Reproduce protocol key and hex boundaries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/key-hex-boundaries.yml', 'scripts/key-hex-boundaries.py', 'fixtures/key-hex/**']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: git clone --no-checkout https://github.com/devdasx/oath-wallet.git .work/wallet
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '26.5.0'}
      - run: |
          mkdir -p evidence/ci/key-hex
          node fixtures/key-hex/reference.cjs > evidence/ci/key-hex/reference.json
          git -C .work/wallet show 235a730de504e47fb961c34f68f9426ffdbdfe6d:Tools/WalletConnectSDKValidation/KeyHexBoundaryTests.swift > .work/key-hex-fixture.swift
          python3 - <<'PYREF'
          import json, re
          from pathlib import Path
          reference = json.loads(Path('evidence/ci/key-hex/reference.json').read_text())
          source = Path('.work/key-hex-fixture.swift').read_text()
          match = re.search(r'XCTAssertEqual\(result.sharedKey.rawRepresentation, Data\(\[([0-9, ]+)\]\)\)', source)
          assert match and [int(value) for value in match[1].split(',')] == reference['expected']
          PYREF
      - run: python3 scripts/key-hex-boundaries.py .work/wallet .work/key-hex-build evidence/ci/key-hex
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: key-hex-boundary-evidence, path: evidence/ci/key-hex, retention-days: 90}
