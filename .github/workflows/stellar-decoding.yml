name: Replay independent Stellar decoding checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/stellar-decoding.yml', 'scripts/stellar-decoding-review.py', 'scripts/stellar-decoding-vectors.py', 'scripts/stellar-decoding-mutation.py', 'fixtures/stellar-decoding/**', 'tests/test_stellar_decoding_review.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_stellar_decoding_review.py
      - run: |
          git clone --no-checkout https://github.com/OathWallet/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach c2ff488a7c7a647b2e6ab03aa1768f5735928e7e
          python3 scripts/stellar-decoding-review.py .work/wallet .work/stellar-decoding evidence/ci/stellar-decoding/baseline
          python3 scripts/stellar-decoding-mutation.py .work/stellar-decoding evidence/ci/stellar-decoding/baseline evidence/ci/stellar-decoding/mutation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: stellar-decoding-evidence, path: evidence/ci/stellar-decoding, retention-days: 90}
