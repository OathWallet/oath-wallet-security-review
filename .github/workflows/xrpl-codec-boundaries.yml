name: Rebuild XRP codec and test request boundaries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/xrpl-codec-boundaries.yml', 'scripts/xrpl-codec-provenance.py', 'scripts/xrpl-connect-boundaries.py', 'fixtures/xrpl-signing/WalletConnectXrplAuditBoundaryTests.swift', 'tests/test_xrpl_codec_review.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '26.5.0'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_xrpl_codec_review.py
      - run: |
          git clone --no-checkout https://github.com/devdasx/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach 8a31eb265c34ef7f37ba21741201842366d43b7b
      - run: |
          mkdir -p evidence/ci/xrpl-codec
          cp evidence/ci/toolchain.txt evidence/ci/xrpl-codec/
          python3 scripts/xrpl-codec-provenance.py .work/wallet .work/provenance evidence/ci/xrpl-codec/provenance
          python3 scripts/xrpl-connect-boundaries.py .work/wallet .work/boundaries evidence/ci/xrpl-codec/boundaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: xrpl-codec-boundary-evidence, path: evidence/ci/xrpl-codec, retention-days: 90}
