name: Review message signature domains
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/message-domain-review.yml', 'scripts/message-domain-review.py', 'fixtures/message-domains/**', 'tests/test_message_domain_review.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_message_domain_review.py
      - run: |
          git clone --no-checkout https://github.com/OathWallet/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach f857fa9ece0b290e1b9ab9cf5e3cb85ebacc045e
          python3 scripts/message-domain-review.py .work/wallet .work/message-domain evidence/ci/message-domain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: message-domain-review-evidence, path: evidence/ci/message-domain, retention-days: 90}
