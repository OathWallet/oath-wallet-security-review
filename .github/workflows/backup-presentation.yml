name: Reproduce backup progress ownership
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/backup-presentation.yml', 'scripts/backup-presentation.py', 'tests/test_backup_presentation.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_backup_presentation.py
      - run: git clone --no-checkout https://github.com/devdasx/oath-wallet.git .work/wallet
      - run: |
          mkdir -p evidence/ci/backup-presentation
          cp evidence/ci/toolchain.txt evidence/ci/backup-presentation/
          python3 scripts/backup-presentation.py .work/wallet evidence/ci/backup-presentation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: backup-presentation-evidence, path: evidence/ci/backup-presentation, retention-days: 90}
