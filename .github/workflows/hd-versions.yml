name: Check Wallet Core extended-key versions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/UpstreamHDVersions.cpp
      - .github/workflows/hd-versions.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: trustwallet/wallet-core
          ref: d40d24a63d92619167903369308bf0e2f7eb3a59
          path: .work/core
          persist-credentials: false
      - name: Check the public and private version predicates against the ABI
        run: |
          set -eu
          mkdir -p evidence/ci
          clang++ --version > evidence/ci/compiler.txt
          clang++ -std=c++20 -O2 -fsanitize=undefined -fno-sanitize-recover=all -I .work/core/include \
            .work/core/src/interface/TWHDVersion.cpp tests/UpstreamHDVersions.cpp -o "$RUNNER_TEMP/hd-versions"
          "$RUNNER_TEMP/hd-versions" > evidence/ci/result.log
          cat evidence/ci/result.log
          shasum -a 256 tests/UpstreamHDVersions.cpp .work/core/include/TrustWalletCore/TWHDVersion.h \
            .work/core/src/interface/TWHDVersion.cpp evidence/ci/result.log > evidence/ci/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: hd-version-evidence, path: evidence/ci, retention-days: 90}
