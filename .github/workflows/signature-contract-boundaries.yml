name: Reproduce signature and contract verification encodings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/signature-contract-boundaries.yml', 'scripts/signature-contract-boundaries.py', 'fixtures/contract-signatures/**']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: git clone --no-checkout https://github.com/devdasx/oath-wallet.git .work/wallet
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '26.5.0'}
      - run: |
          npm ci --ignore-scripts --prefix fixtures/contract-signatures --cache .work/npm-cache
          node fixtures/contract-signatures/generate.cjs > .work/generated-vectors.swift
          git -C .work/wallet show 9193c64c6435f60b3ec856e318cdc7d8df5935d8:Tools/WalletConnectSDKValidation/ContractSignatureVectors.swift > .work/pinned-vectors.swift
          cmp .work/generated-vectors.swift .work/pinned-vectors.swift
      - run: python3 scripts/signature-contract-boundaries.py .work/wallet .work/signature-build evidence/ci/signature-contracts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: signature-contract-boundary-evidence, path: evidence/ci/signature-contracts, retention-days: 90}
