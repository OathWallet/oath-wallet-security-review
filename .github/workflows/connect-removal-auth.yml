name: Check delayed authorization during wallet removal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-removal-auth.yml', 'scripts/connect-removal-auth.py', 'fixtures/connect-removal-auth/**', 'tests/test_connect_removal_auth.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_connect_removal_auth.py
      - run: |
          git clone --no-checkout https://github.com/OathWallet/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach 0e91ce56f91ef56b3e45629967e01e449be0052f
      - run: |
          mkdir -p evidence/ci/connect-removal-auth
          cp evidence/ci/toolchain.txt evidence/ci/connect-removal-auth/
          python3 scripts/connect-removal-auth.py .work/wallet .work/build evidence/ci/connect-removal-auth/replay
          python3 scripts/connect-removal-auth.py .work/wallet .work/build evidence/ci/connect-removal-auth/mutant --mutate-stored-envelope
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: connect-removal-auth-evidence, path: evidence/ci/connect-removal-auth, retention-days: 90}
