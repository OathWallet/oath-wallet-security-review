name: Verify privacy evidence and automatic prompt policy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/privacy-and-prompt.yml', 'scripts/automatic-biometric-prompt.py', 'tests/test_privacy_cover_evidence.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_privacy_cover_evidence.py
      - run: python3 scripts/checkout.py
      - run: python3 scripts/automatic-biometric-prompt.py .work/source evidence/ci/prompt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: privacy-prompt-host-evidence, path: evidence/ci, retention-days: 90}
