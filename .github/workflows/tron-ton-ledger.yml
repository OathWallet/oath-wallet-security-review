name: Check TRON and TON offline ledger boundaries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/tron-ton-ledger.yml', 'scripts/tron-ton-ledger.py', 'tests/test_tron_ton_ledger.py']
permissions:
  contents: read
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      OATH_REVIEW_XCODE: '27.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14.7'}
      - run: sh scripts/toolchain.sh
      - run: python3 -m unittest discover -s tests -p test_tron_ton_ledger.py
      - run: |
          git clone --no-checkout https://github.com/devdasx/oath-wallet.git .work/wallet
          git -C .work/wallet checkout --detach fd06fdff104d128e00cc414d2de1472f11752e04
          python3 scripts/tron-ton-ledger.py .work/wallet .work/build evidence/ci/tron-ton-ledger
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: tron-ton-ledger-evidence, path: evidence/ci/tron-ton-ledger, retention-days: 90}
